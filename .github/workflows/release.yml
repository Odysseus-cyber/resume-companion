name: Build release packages

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check version matches tag
        run: node -e 'const p = require("./package.json"); if (process.env.GITHUB_REF_NAME !== `v${p.version}`) process.exit(1)'
      - run: ./scripts/dev.sh install --frozen-lockfile
      - run: ./scripts/dev.sh run check
      - run: ./scripts/dev.sh run build:edge
      - run: ./scripts/dev.sh exec playwright install --with-deps chromium
      - run: ./scripts/dev.sh run test:e2e
      - run: ./scripts/dev.sh run zip
      - name: Record source revision
        run: |
          git rev-parse HEAD > .output/SOURCE_COMMIT.txt
          cp CHANGELOG.md .output/CHANGELOG.md
      - uses: actions/upload-artifact@v4
        with:
          name: extension-release
          path: |
            .output/*.zip
            .output/SOURCE_COMMIT.txt
            .output/CHANGELOG.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  publish-draft:
    needs: validate-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension-release
          path: release-assets
      - name: Create draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft --title "$RELEASE_TAG" --notes-file release-assets/CHANGELOG.md
